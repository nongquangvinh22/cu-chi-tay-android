name: Build AirControl AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - aircontrolai-github-actions

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          echo "Using SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore AirControl AI project
        shell: bash
        run: |
          set -euo pipefail
          cat AirControlAI_source.part01.b64 AirControlAI_source.part02.b64 AirControlAI_source.part03.b64 AirControlAI_source.part04.b64 AirControlAI_source.part05.b64 AirControlAI_source.part06a.b64 AirControlAI_source.part06b.b64 AirControlAI_source.part07a.b64 AirControlAI_source.part07b.b64 > "$RUNNER_TEMP/AirControlAI_source.zip.b64"
          test "$(wc -c < "$RUNNER_TEMP/AirControlAI_source.zip.b64")" -eq 25912
          base64 --decode "$RUNNER_TEMP/AirControlAI_source.zip.b64" > "$RUNNER_TEMP/AirControlAI_source.zip"
          mkdir -p "$RUNNER_TEMP/aircontrol-source"
          unzip -q "$RUNNER_TEMP/AirControlAI_source.zip" -d "$RUNNER_TEMP/aircontrol-source"
          test -d "$RUNNER_TEMP/aircontrol-source/AirControlAI/app/src/main"
          cp -a "$RUNNER_TEMP/aircontrol-source/AirControlAI/." .
          rm -rf "$RUNNER_TEMP/aircontrol-source" "$RUNNER_TEMP/AirControlAI_source.zip.b64" AirControlAI_source.part*.b64
          echo "Project files restored."

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirControlAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
