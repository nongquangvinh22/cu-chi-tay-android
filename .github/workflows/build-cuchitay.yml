name: Build Cử Chỉ Tay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CuChiTay-project/CuChiTay/**"
      - ".github/workflows/build-cuchitay.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CuChiTay-project/CuChiTay
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cuchitay-debug-keystore-v1

      - name: Create debug signing key when needed
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download MediaPipe hand model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          test -s app/src/main/assets/hand_landmarker.task

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuChiTay-apk-v3
          path: CuChiTay-project/CuChiTay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
