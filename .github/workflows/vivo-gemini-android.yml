name: Build Vinh Circle APK

on:
  push:
    branches: [main]
    paths:
      - 'VivoGeminiAssistant/app/src/**'
      - 'VivoGeminiAssistant/app/build.gradle'
      - 'VivoGeminiAssistant/build.gradle'
      - 'VivoGeminiAssistant/settings.gradle'
      - 'VivoGeminiAssistant/gradle.properties'
      - 'VivoGeminiAssistant/debug.keystore'
      - '.github/workflows/vivo-gemini-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          echo "Using SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p VivoGeminiAssistant :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinhCircle-v0.4.0
          path: VivoGeminiAssistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save APK in the repository
        shell: bash
        run: |
          set -euo pipefail
          cp VivoGeminiAssistant/app/build/outputs/apk/debug/app-debug.apk VivoGeminiAssistant/dist/VinhCircle.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VivoGeminiAssistant/dist/VinhCircle.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Vinh Circle v0.4.0 APK"
            git push
          fi

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-build-${{ github.run_number }}
          name: Vinh Circle v0.4.0 (build ${{ github.run_number }})
          target_commitish: main
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: VivoGeminiAssistant/dist/VinhCircle.apk
