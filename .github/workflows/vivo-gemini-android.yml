name: Build Vivo Gemini Assistant APK

on:
  push:
    branches: [main]
    paths:
      - 'VivoGeminiAssistant/**'
      - '.github/workflows/vivo-gemini-android.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the built APK as a GitHub prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p VivoGeminiAssistant :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VivoGeminiAssistant-debug-apk
          path: VivoGeminiAssistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.\${{ github.run_number }}
          name: Vivo Gemini Assistant v0.1.0-alpha.\${{ github.run_number }}
          target_commitish: main
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: VivoGeminiAssistant/app/build/outputs/apk/debug/app-debug.apk
