name: Build NQV AirShare 0.2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NQV-AirShare/**"
      - ".github/workflows/build-nqv-airshare.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NQV-AirShare
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build optimized release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NQV-AirShare-v0.2.0-Release
          path: NQV-AirShare/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nqv-airshare-0.2.0-build-${{ github.run_number }}
          name: NQV AirShare 0.2.0
          target_commitish: main
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: NQV-AirShare/app/build/outputs/apk/release/app-release.apk
