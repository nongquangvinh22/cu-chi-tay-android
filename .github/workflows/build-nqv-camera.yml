name: Build NQV Camera APK

on:
  push:
    branches:
      - nqv-camera-v1
    paths:
      - 'NQV-Camera-source.part-*'
      - '.github/workflows/build-nqv-camera.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Decode Android project archive
        run: |
          cat NQV-Camera-source.part-* > NQV-Camera-source.b64
          base64 --decode NQV-Camera-source.b64 > NQV-Camera-source.zip
          unzip -q NQV-Camera-source.zip -d .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: NQV-Camera
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nqv-camera-debug-apk
          path: NQV-Camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
